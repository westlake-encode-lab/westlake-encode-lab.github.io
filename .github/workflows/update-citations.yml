name: Update Google Scholar Citations

on:
  schedule:
    - cron: "0 0 * * 1,3,5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scholar-citations
  cancel-in-progress: false

jobs:
  update-citations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-citations.txt

      - name: Install configuration parser
        run: python -m pip install 'pyyaml>=6,<7'

      - name: Check citation configuration
        id: config
        run: python bin/update_scholar_citations.py --check-config

      - name: Install citation dependencies
        if: steps.config.outputs.enabled == 'true'
        run: python -m pip install -r requirements-citations.txt

      - name: Update citations
        if: steps.config.outputs.enabled == 'true'
        run: timeout 90 python bin/update_scholar_citations.py

      - name: Commit citation changes
        if: steps.config.outputs.enabled == 'true'
        run: |
          if [ ! -f _data/citations.yml ]; then
            echo "No citation file was generated; nothing to commit."
            exit 0
          fi
          git add -- _data/citations.yml
          if git diff --cached --quiet; then
            echo "Citation data is unchanged."
            exit 0
          fi
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git commit -m "chore: Update Google Scholar citations"
          git push
